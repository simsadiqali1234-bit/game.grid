
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flip Matrix | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px 15px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 15px; }
    h1 { color: #ffffff; margin-bottom: 5px; }
    .stats { font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; }
    .stats span { color: #f43f5e; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin: 0 auto 25px; }
    .card { width: 70px; height: 70px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: transform 0.3s, background 0.3s; color: transparent; }
    .card.flipped { background: #38bdf8; color: #fff; transform: rotateY(180deg); border-color: #38bdf8; }
    .card.matched { background: #10b981; color: #fff; border-color: #10b981; cursor: default; transform: rotateY(180deg); }
    button { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; }
    button:hover { background: #e11d48; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Memory Flip Matrix</h1>
  <div class="stats">Moves: <span id="moveCount">0</span> | Matches: <span id="matchCount">0</span>/8</div>

  <div class="grid" id="gameBoard"></div>

  <button onclick="initGame()">Restart Matrix</button>

  <script>
    const emojis = ["💻", "💻", "⌨️", "⌨️", "💾", "💾", "📱", "📱", "🔋", "🔋", "🎮", "🎮", "⚙️", "⚙️", "🚀", "🚀"];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    const board = document.getElementById("gameBoard");
    const moveDisplay = document.getElementById("moveCount");
    const matchDisplay = document.getElementById("matchCount");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function initGame() {
      board.innerHTML = "";
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      moveDisplay.textContent = moves;
      matchDisplay.textContent = matchedPairs;
      
      const shuffledEmojis = shuffle([...emojis]);
      
      shuffledEmojis.forEach((emoji, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.addEventListener("click", flipCard);
        board.appendChild(card);
      });
    }

    function flipCard() {
      if (flippedCards.length < 2 && !this.classList.contains("flipped") && !this.classList.contains("matched")) {
        this.classList.add("flipped");
        this.textContent = this.dataset.emoji;
        flippedCards.push(this);

        if (flippedCards.length === 2) {
          moves++;
          moveDisplay.textContent = moves;
          setTimeout(checkMatch, 800);
        }
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      
      if (card1.dataset.emoji === card2.dataset.emoji) {
        card1.classList.replace("flipped", "matched");
        card2.classList.replace("flipped", "matched");
        matchedPairs++;
        matchDisplay.textContent = matchedPairs;
        
        if (matchedPairs === 8) {
          setTimeout(() => alert("Matrix Solved in " + moves + " moves!"), 300);
        }
      } else {
        card1.classList.remove("flipped");
        card1.textContent = "";
        card2.classList.remove("flipped");
        card2.textContent = "";
      }
      flippedCards = [];
    }

    initGame();
  </script>
</body>
</html>

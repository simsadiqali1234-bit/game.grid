<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction Timer | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; }
    #reactionBox { width: 100%; max-width: 500px; height: 300px; background: #f43f5e; margin: 20px auto; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; color: #fff; cursor: pointer; user-select: none; transition: background 0.2s; border: 3px solid #334155; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Reaction Speed Tester</h1>
  <p>Click the box as soon as it turns Green!</p>

  <div id="reactionBox" onclick="handleClick()">Click here to Start</div>

  <script>
    const box = document.getElementById("reactionBox");
    let state = "waiting"; // waiting, ready, click, result
    let startTime, timeoutId;

    function handleClick() {
      if (state === "waiting") {
        box.style.background = "#eab308"; // Yellow (Wait for green)
        box.textContent = "Wait for Green...";
        state = "ready";
        
        let randomTime = Math.floor(Math.random() * 2000) + 1500; // 1.5 to 3.5 seconds
        timeoutId = setTimeout(() => {
          box.style.background = "#10b981"; // Green
          box.textContent = "CLICK NOW!";
          startTime = new Date().getTime();
          state = "click";
        }, randomTime);

      } else if (state === "ready") {
        clearTimeout(timeoutId);
        box.style.background = "#f43f5e";
        box.textContent = "Too soon! Click to restart.";
        state = "waiting";

      } else if (state === "click") {
        let reactionTime = new Date().getTime() - startTime;
        box.style.background = "#38bdf8";
        box.textContent = `⚡ ${reactionTime} ms! Click to play again.`;
        state = "waiting";

      } else {
        box.style.background = "#f43f5e";
        box.textContent = "Click here to Start";
        state = "waiting";
      }
    }
  </script>
</body>
</html>

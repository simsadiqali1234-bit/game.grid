<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Car Dodger | Game Grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    h1 { color: #ffffff; margin-bottom: 5px; }
    .scoreboard { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #38bdf8; }
    .scoreboard span { color: #f43f5e; }
    canvas { background: #1e293b; border: 2px solid #334155; border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.5); display: block; margin: 0 auto; }
    p { color: #94a3b8; font-size: 0.95rem; margin-top: 10px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game Grid</a>
  <h1>Retro Car Dodger</h1>
  <div class="scoreboard">Score: <span id="score">0</span></div>
  
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <p>Use Left & Right Arrow keys to steer your car!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    let score = 0;
    let isGameOver = false;

    // Player Car
    let player = { x: 175, y: 400, width: 50, height: 80, speed: 8, dx: 0 };

    // Obstacle Car
    let obstacle = { x: Math.floor(Math.random() * 3) * 100 + 50, y: -100, width: 50, height: 80, speed: 4 };

    const lanes = [50, 150, 250]; // 3 possible lanes on the 400px wide canvas

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") player.dx = -player.speed;
      if (e.key === "ArrowRight") player.dx = player.speed;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") player.dx = 0;
    });

    function resetGame() {
      score = 0;
      scoreElement.textContent = score;
      player.x = 175;
      obstacle.y = -100;
      obstacle.speed = 4;
      isGameOver = false;
      loop();
    }

    function update() {
      if (isGameOver) return;

      player.x += player.dx;
      // Keep player inside road boundaries
      if (player.x < 40) player.x = 40;
      if (player.x > 310) player.x = 310;

      obstacle.y += obstacle.speed;

      // Reset obstacle when it goes off screen & increase score
      if (obstacle.y > canvas.height) {
        obstacle.y = -100;
        obstacle.x = lanes[Math.floor(Math.random() * lanes.length)];
        score += 10;
        scoreElement.textContent = score;
        obstacle.speed += 0.2; // Gradually increase difficulty speed
      }

      // Collision Detection (AABB bounding box)
      if (
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y < obstacle.y + obstacle.height &&
        player.y + player.height > obstacle.y
      ) {
        isGameOver = true;
        alert("Game Over! Final Score: " + score);
        resetGame();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Road Background & Lanes
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(30, 0, 340, canvas.height);

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      
      // Lane dividers
      ctx.beginPath();
      ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
      ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // Draw Player Car
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Windshield & Details
      ctx.fillStyle = "#090d16";
      ctx.fillRect(player.x + 8, player.y + 15, 34, 20);

      // Draw Obstacle Car
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      ctx.fillStyle = "#090d16";
      ctx.fillRect(obstacle.x + 8, obstacle.y + 15, 34, 20);
    }

    function loop() {
      if (!isGameOver) {
        update();
        draw();
        requestAnimationFrame(loop);
      }
    }

    loop();
  </script>
</body>
</html>

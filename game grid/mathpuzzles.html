<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mathematics Puzzles | Game Grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; }
    .puzzle-box { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 30px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .question { font-size: 1.4rem; font-weight: bold; color: #38bdf8; margin-bottom: 20px; }
    input { padding: 12px; width: 200px; font-size: 1.2rem; border-radius: 8px; border: 2px solid #334155; background: #090d16; color: #fff; text-align: center; outline: none; margin-bottom: 15px; }
    button { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; display: block; margin: 0 auto; }
    button:hover { background: #e11d48; }
    #remark { font-size: 1.2rem; font-weight: bold; margin-top: 20px; min-height: 40px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game Grid</a>
  <h1>Mathematics Puzzles</h1>
  <p>Test your brain with tricky number logic puzzles!</p>

  <div class="puzzle-box">
    <div class="question" id="qText">Loading puzzle...</div>
    <input type="number" id="ansInput" placeholder="Enter answer...">
    <button onclick="checkAnswer()">Submit Answer</button>
  </div>

  <div id="remark"></div>

  <script>
    const puzzles = [
      { q: "If 2 + 3 = 10, 3 + 4 = 21, then 5 + 6 = ?", ans: 55 },
      { q: "If a dozen eggs cost ₹60, what is the price of 3 eggs?", ans: 15 },
      { q: "Find the missing number: 2, 4, 8, 16, ?", ans: 32 },
      { q: "If 5 cats catch 5 mice in 5 minutes, how many minutes for 1 cat to catch 1 mouse?", ans: 5 },
      { q: "What is 50 + 50 * 0 + 20?", ans: 70 }
    ];

    let currentIdx = 0;
    const qText = document.getElementById("qText");
    const ansInput = document.getElementById("ansInput");
    const remark = document.getElementById("remark");

    function loadPuzzle() {
      if (currentIdx >= puzzles.length) {
        qText.textContent = "🎉 Shabaash! Tumne saare puzzles solve kar liye!";
        ansInput.style.display = "none";
        document.querySelector("button").style.display = "none";
        remark.textContent = "🔥 Ekdam Ramanujan ban gaye ho bhai! Maan gaye!";
        remark.style.color = "#10b981";
        return;
      }
      qText.textContent = puzzles[currentIdx].q;
      ansInput.value = "";
      remark.textContent = "";
    }

    function checkAnswer() {
      let userAns = Number(ansInput.value);
      if (userAns === puzzles[currentIdx].ans) {
        const correctRemarks = [
          "🔥 Sahi jawab! Dimaag ki batti jala di bhai!",
          "😎 Ekdam genius ho yaar! Agla sawal solve karo.",
          "🎯 Bilkul thik! Ustaad nikle tum toh maths میں.",
          "⚡ Lightning speed aur sahi jawab! Wah bhai wah!"
        ];
        remark.textContent = correctRemarks[Math.floor(Math.random() * correctRemarks.length)];
        remark.style.color = "#10b981";
        currentIdx++;
        setTimeout(loadPuzzle, 1500);
      } else {
        const wrongRemarks = [
          "❌ Arre yaar galat! Thoda aur dimaag lagao.",
          "😅 Calculator ki zaroorat padegi lagta hai! Dobara try karo.",
          "💀 Yeh kya jawab tha? Phir se socho bhai!",
          "🤦‍♂️ Arey bhai bhai bhai! Galat jawab, doosra try maaro."
        ];
        remark.textContent = wrongRemarks[Math.floor(Math.random() * wrongRemarks.length)];
        remark.style.color = "#f43f5e";
      }
    }

    loadPuzzle();
  </script>
</body>
</html>

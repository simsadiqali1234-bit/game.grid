<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block Jump | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 30px; overflow: hidden; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; margin-bottom: 20px; display: inline-block; }
    #gameArea { width: 600px; height: 200px; background: #1e293b; border: 2px solid #334155; margin: 0 auto; position: relative; overflow: hidden; border-radius: 8px; }
    #player { width: 30px; height: 30px; background: #f43f5e; position: absolute; bottom: 0; left: 50px; }
    #obstacle { width: 20px; height: 40px; background: #38bdf8; position: absolute; bottom: 0; right: -20px; }
    .jump { animation: jumpAnim 0.5s linear; }
    @keyframes jumpAnim { 0%{bottom:0;} 40%{bottom:90px;} 50%{bottom:100px;} 60%{bottom:90px;} 100%{bottom:0;} }
    #scoreDisplay { font-size: 1.5rem; margin-top: 15px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Block Jump Runner</h1>
  <p>Press <b>Spacebar</b> or Tap the game area to jump!</p>

  <div id="gameArea" onclick="jump()">
    <div id="player"></div>
    <div id="obstacle"></div>
  </div>
  
  <div id="scoreDisplay">Score: <span id="score">0</span></div>

  <script>
    const player = document.getElementById("player");
    const obstacle = document.getElementById("obstacle");
    const scoreElement = document.getElementById("score");
    let isJumping = false;
    let score = 0;
    let gameSpeed = 2; // seconds for obstacle animation

    function jump() {
      if (!isJumping) {
        isJumping = true;
        player.classList.add("jump");
        setTimeout(() => { player.classList.remove("jump"); isJumping = false; }, 500);
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.code === "Space") jump();
    });

    function startGame() {
      obstacle.style.animation = `moveObstacle ${gameSpeed}s infinite linear`;
    }

    const checkDead = setInterval(function() {
      let playerTop = parseInt(window.getComputedStyle(player).getPropertyValue("top"));
      let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));

      if (obstacleLeft < 80 && obstacleLeft > 50 && playerTop >= 170) {
        obstacle.style.animation = "none";
        alert("Game Over! Score: " + Math.floor(score/100));
        score = 0;
        obstacle.style.animation = `moveObstacle ${gameSpeed}s infinite linear`;
      } else {
        score++;
        scoreElement.textContent = Math.floor(score/100);
      }
    }, 10);

    // CSS for dynamic obstacle movement
    const style = document.createElement('style');
    style.innerHTML = `@keyframes moveObstacle { 0% { left: 600px; } 100% { left: -20px; } }`;
    document.head.appendChild(style);

    startGame();
  </script>
</body>
</html>

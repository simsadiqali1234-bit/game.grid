<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Typer Pro | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px 15px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; margin-bottom: 10px; }
    .quote { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; font-size: 1.2rem; max-width: 600px; margin: 0 auto 20px; color: #94a3b8; }
    textarea { width: 100%; max-width: 600px; height: 100px; padding: 15px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #334155; background: #020617; color: #fff; outline: none; transition: 0.2s; resize: none; }
    textarea:focus { border-color: #38bdf8; }
    .result { font-size: 1.4rem; color: #f43f5e; font-weight: 700; margin: 20px 0; min-height: 30px; }
    button { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #e11d48; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Speed Typer Pro</h1>
  <p>Test your Words Per Minute (WPM) speed!</p>

  <div class="quote" id="quoteText">Loading text...</div>
  <textarea id="typeInput" placeholder="Start typing exactly as above to begin the timer..."></textarea>
  
  <div class="result" id="resultText"></div>
  <button onclick="startTest()">New Sentence</button>

  <script>
    const sentences = [
      "HTML is the standard markup language for documents designed to be displayed in a web browser.",
      "JavaScript is a lightweight, interpreted programming language with first-class functions.",
      "Linux is a family of open-source Unix-like operating systems based on the Linux kernel.",
      "The quick brown fox jumps over the lazy dog in the middle of the dark forest."
    ];
    
    let startTime, endTime;
    let testActive = false;
    
    const quoteText = document.getElementById("quoteText");
    const typeInput = document.getElementById("typeInput");
    const resultText = document.getElementById("resultText");

    function startTest() {
      const randomSentence = sentences[Math.floor(Math.random() * sentences.length)];
      quoteText.textContent = randomSentence;
      typeInput.value = "";
      typeInput.disabled = false;
      resultText.textContent = "";
      testActive = false;
      typeInput.focus();
    }

    typeInput.addEventListener("input", function() {
      if (!testActive && typeInput.value.length > 0) {
        testActive = true;
        startTime = new Date().getTime(); // Timer starts on first key press
      }

      if (typeInput.value === quoteText.textContent) {
        endTime = new Date().getTime(); // Timer stops when text matches exactly
        testActive = false;
        typeInput.disabled = true;
        
        let timeTaken = (endTime - startTime) / 1000; // Time in seconds
        let words = quoteText.textContent.split(" ").length;
        let wpm = Math.round((words / timeTaken) * 60);
        
        resultText.textContent = "🔥 Speed: " + wpm + " WPM (Time: " + timeTaken.toFixed(1) + "s)";
      }
    });

    startTest();
  </script>
</body>
</html>

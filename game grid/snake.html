<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Snake | Game grid</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    .back-btn {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }

    canvas {
      width: min(800px, 90vw);
      height: auto;
      background: #1e293b;
      border: 2px solid #334155;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    h2 { margin: 10px 0; }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Classic Snake Game</h1>
  <h2>Score: <span id="score" style="color: #10b981;">0</span></h2>

  <canvas id="gameCanvas" width="800" height="800"></canvas>
  <p style="color: #94a3b8; font-size: 0.9rem;">Use Arrow Keys to move.</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    let snake = [{ x: 200, y: 200 }];
    let food = { x: 100, y: 100 };
    let dx = 0;
    let dy = -gridSize;
    let score = 0;

    function randomFood() {
      food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
      food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
    }

    function drawRect(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, gridSize - 2, gridSize - 2);
    }

    function main() {
      if (hasGameEnded()) {
        alert("Game Over! Score: " + score + ". Refresh to play again.");
        return;
      }

      setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRect(food.x, food.y, "#f43f5e");

        // Wrap around to the opposite edge when crossing a wall.
        const head = {
          x: (snake[0].x + dx + canvas.width) % canvas.width,
          y: (snake[0].y + dy + canvas.height) % canvas.height
        };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreElement.textContent = score;
          randomFood();
        } else {
          snake.pop();
        }

        snake.forEach((part, index) => {
          drawRect(part.x, part.y, index === 0 ? "#38bdf8" : "#94a3b8");
        });

        main();
      }, 100);
    }

    function hasGameEnded() {
      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
          return true;
        }
      }
      return false;
    }

    document.addEventListener("keydown", (e) => {
      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;

      if ((e.key === "ArrowLeft" || e.keyCode === 37) && !goingRight) {
        dx = -gridSize;
        dy = 0;
      } else if ((e.key === "ArrowUp" || e.keyCode === 38) && !goingDown) {
        dx = 0;
        dy = -gridSize;
      } else if ((e.key === "ArrowRight" || e.keyCode === 39) && !goingLeft) {
        dx = gridSize;
        dy = 0;
      } else if ((e.key === "ArrowDown" || e.keyCode === 40) && !goingUp) {
        dx = 0;
        dy = gridSize;
      }
    });

    randomFood();
    main();
  </script>
</body>
</html>

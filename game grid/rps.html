<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; }
    .scoreboard { display: flex; justify-content: center; gap: 40px; font-size: 1.3rem; margin: 20px 0; font-weight: bold; }
    .scoreboard span { color: #f43f5e; }
    .choices { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
    .choice-btn { background: #1e293b; border: 3px solid #334155; font-size: 3rem; padding: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
    .choice-btn:hover { border-color: #38bdf8; transform: scale(1.05); }
    #resultText { font-size: 1.5rem; font-weight: bold; margin-top: 20px; min-height: 40px; color: #38bdf8; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Rock Paper Scissors</h1>
  
  <div class="scoreboard">
    <div>Player: <span id="playerScore">0</span></div>
    <div>Computer: <span id="compScore">0</span></div>
  </div>

  <div class="choices">
    <button class="choice-btn" onclick="play('Rock')">✊</button>
    <button class="choice-btn" onclick="play('Paper')">✋</button>
    <button class="choice-btn" onclick="play('Scissors')">✌️</button>
  </div>

  <div id="resultText">Choose your weapon!</div>

  <script>
    let pScore = 0;
    let cScore = 0;

    function play(playerChoice) {
      const choices = ['Rock', 'Paper', 'Scissors'];
      const computerChoice = choices[Math.floor(Math.random() * 3)];
      
      const emojis = { 'Rock': '✊', 'Paper': '✋', 'Scissors': '✌️' };
      
      let result = "";

      if (playerChoice === computerChoice) {
        result = `🤝 It's a Tie! Both chose ${emojis[playerChoice]}`;
        document.getElementById("resultText").style.color = "#eab308";
      } else if (
        (playerChoice === 'Rock' && computerChoice === 'Scissors') ||
        (playerChoice === 'Paper' && computerChoice === 'Rock') ||
        (playerChoice === 'Scissors' && computerChoice === 'Paper')
      ) {
        pScore++;
        document.getElementById("playerScore").textContent = pScore;
        result = `🎉 You Win! Computer chose ${emojis[computerChoice]}`;
        document.getElementById("resultText").style.color = "#10b981";
      } else {
        cScore++;
        document.getElementById("compScore").textContent = cScore;
        result = `❌ You Lose! Computer chose ${emojis[computerChoice]}`;
        document.getElementById("resultText").style.color = "#f43f5e";
      }

      document.getElementById("resultText").textContent = result;
    }
  </script>
</body>
</html>

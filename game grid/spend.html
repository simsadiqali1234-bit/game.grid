<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spend Modi's Money | Game Grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    h1 { color: #ffffff; margin-bottom: 5px; }
    .money-bar { background: #020617; border: 2px solid #334155; padding: 20px; font-size: 2rem; font-weight: 800; color: #10b981; position: sticky; top: 10px; z-index: 100; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto 40px; }
    .item-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .item-name { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
    .item-price { color: #38bdf8; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
    .controls { display: flex; align-items: center; gap: 15px; width: 100%; justify-content: center; }
    button { background: #f43f5e; color: #fff; border: none; padding: 8px 16px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e11d48; }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    button.buy-btn { background: #10b981; }
    button.buy-btn:hover { background: #059669; }
    .qty { font-size: 1.2rem; font-weight: bold; color: #fff; min-width: 30px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game Grid</a>
  <h1>Spend Modi's Money</h1>
  <p style="color: #94a3b8;">You have ₹10,000 Crores to spend on whatever you want!</p>

  <div class="money-bar" id="moneyDisplay">₹10,000 Crore</div>

  <div class="shop-grid" id="shopGrid"></div>

  <script>
    const INITIAL_MONEY = 10000; // 10,000 Crores
    let money = INITIAL_MONEY;

    const items = [
      { id: 1, name: "Chai ka Cup", price: 0.001, emoji: "☕", qty: 0 },
      { id: 2, name: "Vande Bharat Ticket", price: 0.005, emoji: "🚆", qty: 0 },
      { id: 3, name: "Smartphone", price: 0.05, emoji: "📱", qty: 0 },
      { id: 4, name: "Electric Scooter", price: 0.1, emoji: "🛵", qty: 0 },
      { id: 5, name: "Desi Cow", price: 0.15, emoji: "🐄", qty: 0 },
      { id: 6, name: "Family Car", price: 1, emoji: "🚗", qty: 0 },
      { id: 7, name: "Luxury Apartment", price: 5, emoji: "🏢", qty: 0 },
      { id: 8, name: "Cricket Stadium", price: 100, emoji: "🏏", qty: 0 },
      { id: 9, name: "Commercial Airplane", price: 500, emoji: "✈️", qty: 0 },
      { id: 10, name: "Space Satellite", price: 1000, emoji: "🛰️", qty: 0 }
    ];

    const moneyDisplay = document.getElementById("moneyDisplay");
    const shopGrid = document.getElementById("shopGrid");

    function getRemark(spent) {
      if (spent === 0) return "💡 Paise bache hain, kharch karna shuru karo!";
      if (spent < 500) return "☕ Abhi toh bas chai-pani par kharcha hua hai!";
      if (spent < 2000) return "🛵 Sahi chal rahe ho, gadhiyan aur phones kharide ja rahe hain.";
      if (spent < 5000) return "🏢 Uff! Luxury apartments aur cars aane lage!";
      if (spent < 9000) return "🏏 Bhai sahab! Cricket stadiums aur airplanes kharid liye!";
      return "🚀 Arre baap re! Tumne toh saare 10,000 Crores uda diye, poora desh kharid loge kya?!";
    }

    function renderShop() {
      shopGrid.innerHTML = "";
      let spent = INITIAL_MONEY - money;
      
      moneyDisplay.innerHTML = `₹${money.toLocaleString()} Crore<br><span style="font-size: 1rem; color: #38bdf8; font-weight: normal;">${getRemark(spent)}</span>`;

      items.forEach(item => {
        const card = document.createElement("div");
        card.classList.add("item-card");
        
        card.innerHTML = `
          <div style="font-size: 2.5rem;">${item.emoji}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-price">₹${item.price >= 1 ? item.price + ' Crore' : (item.price * 100) + ' Lakh'}</div>
          <div class="controls">
            <button onclick="sellItem(${item.id})" ${item.qty === 0 ? 'disabled' : ''}>Sell</button>
            <span class="qty">${item.qty}</span>
            <button class="buy-btn" onclick="buyItem(${item.id})" ${money < item.price ? 'disabled' : ''}>Buy</button>
          </div>
        `;
        shopGrid.appendChild(card);
      });
    }

    function buyItem(id) {
      const item = items.find(i => i.id === id);
      if (money >= item.price) {
        money -= item.price;
        money = Math.round(money * 1000) / 1000;
        item.qty++;
        renderShop();
      }
    }

    function sellItem(id) {
      const item = items.find(i => i.id === id);
      if (item.qty > 0) {
        money += item.price;
        money = Math.round(money * 1000) / 1000;
        item.qty--;
        renderShop();
      }
    }

    renderShop();
  </script>
</body>
</html>

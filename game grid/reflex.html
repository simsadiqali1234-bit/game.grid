<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reaction Timer | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; margin-bottom: 5px; }
    .best-score { font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; font-weight: 600; }
    .best-score span { color: #10b981; }
    #reactionBox { width: 100%; max-width: 500px; height: 300px; background: #f43f5e; margin: 0 auto 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; color: #fff; cursor: pointer; user-select: none; transition: background 0.2s; border: 3px solid #334155; padding: 20px; box-sizing: border-box; }
    #remark { font-size: 1.1rem; font-weight: 500; margin-top: 10px; color: #e2e8f0; min-height: 30px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Reaction Speed Tester</h1>
  <p>Test how fast your brain reacts when the screen turns green!</p>
  
  <div class="best-score">Best Time: <span id="bestTime">---</span> ms</div>

  <div id="reactionBox" onclick="handleClick()">
    <span id="mainText">Click here to Start</span>
    <span id="remark"></span>
  </div>

  <script>
    const box = document.getElementById("reactionBox");
    const mainText = document.getElementById("mainText");
    const remarkText = document.getElementById("remark");
    const bestTimeDisplay = document.getElementById("bestTime");

    let state = "waiting"; // waiting, ready, click, result
    let startTime, timeoutId;
    let bestScore = null;

    function handleClick() {
      if (state === "waiting") {
        box.style.background = "#eab308"; // Yellow (Wait for green)
        mainText.textContent = "Wait for Green...";
        remarkText.textContent = "Hadd me raho, green aane ka wait karo!";
        state = "ready";
        
        let randomTime = Math.floor(Math.random() * 2000) + 1500; // 1.5 to 3.5 seconds
        timeoutId = setTimeout(() => {
          box.style.background = "#10b981"; // Green
          mainText.textContent = "CLICK NOW!";
          remarkText.textContent = "Fatafat click karo!";
          startTime = new Date().getTime();
          state = "click";
        }, randomTime);

      } else if (state === "ready") {
        clearTimeout(timeoutId);
        box.style.background = "#f43f5e";
        mainText.textContent = "Too soon! ❌";
        remarkText.textContent = "Bahut jaldi click kar diya bhai, dobara try karo!";
        state = "waiting";

      } else if (state === "click") {
        let reactionTime = new Date().getTime() - startTime;
        box.style.background = "#38bdf8";
        mainText.textContent = `⚡ ${reactionTime} ms`;

        // Hindi Remarks based on reaction speed
        let remark = "";
        if (reactionTime < 250) {
          remark = "🔥 Flash ho kya bhai? Ekdum superhuman speed!";
        } else if (reactionTime < 350) {
          remark = "😎 Sahi hai! Kaafi tez reflexes hain tumhare.";
        } else if (reactionTime < 500) {
          remark = "👍 Thoda theek hai, par aur tez haath chalao!";
        } else {
          remark = "🐢 Turtle ki speed hai yeh! Soch kar click kar rahe ho?";
        }
        remarkText.textContent = remark;

        // Update Best Score
        if (bestScore === null || reactionTime < bestScore) {
          bestScore = reactionTime;
          bestTimeDisplay.textContent = bestScore;
        }

        state = "waiting";

      } else {
        box.style.background = "#f43f5e";
        mainText.textContent = "Click here to Start";
        remarkText.textContent = "";
        state = "waiting";
      }
    }
  </script>
</body>
</html>

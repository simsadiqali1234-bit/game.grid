<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Guesser | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px 15px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    h1 { color: #ffffff; }
    #colorCode { font-size: 2.5rem; font-weight: 800; color: #f43f5e; margin: 20px 0; letter-spacing: 2px; }
    .options { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
    .color-box { width: 120px; height: 120px; border-radius: 12px; cursor: pointer; transition: transform 0.2s; border: 3px solid #334155; }
    .color-box:hover { transform: scale(1.05); }
    #status { font-size: 1.5rem; margin-top: 20px; font-weight: bold; min-height: 35px; }
    button { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Guess The RGB Color</h1>
  <div id="colorCode">RGB(0, 0, 0)</div>
  <div id="status">Select a color!</div>
  
  <div class="options">
    <div class="color-box" onclick="checkColor(this)"></div>
    <div class="color-box" onclick="checkColor(this)"></div>
    <div class="color-box" onclick="checkColor(this)"></div>
  </div>

  <button onclick="startGame()">Next Color</button>

  <script>
    let correctColor;
    const boxes = document.querySelectorAll('.color-box');

    function randomRGB() {
      return `rgb(${Math.floor(Math.random()*256)}, ${Math.floor(Math.random()*256)}, ${Math.floor(Math.random()*256)})`;
    }

    function startGame() {
      correctColor = randomRGB();
      document.getElementById('colorCode').textContent = correctColor.toUpperCase();
      document.getElementById('status').textContent = "Select a color!";
      
      let correctBoxIndex = Math.floor(Math.random() * 3);
      boxes.forEach((box, index) => {
        box.style.backgroundColor = (index === correctBoxIndex) ? correctColor : randomRGB();
        box.style.pointerEvents = 'auto'; // Enable clicking
      });
    }

    function checkColor(element) {
      if (element.style.backgroundColor === correctColor) {
        document.getElementById('status').textContent = "🎉 Correct!";
        document.getElementById('status').style.color = "#10b981";
      } else {
        document.getElementById('status').textContent = "❌ Wrong! Try again.";
        document.getElementById('status').style.color = "#f43f5e";
      }
      boxes.forEach(box => box.style.pointerEvents = 'none'); // Disable clicking after guess
    }

    startGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe | Game grid</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px 15px; }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 15px; }
    h1 { color: #ffffff; margin-bottom: 8px; }
    .status { font-size: 1.2rem; color: #f43f5e; font-weight: 700; margin-bottom: 20px; }
    .board { display: grid; grid-template-columns: repeat(3, 95px); gap: 10px; justify-content: center; margin: 0 auto 25px; }
    .cell { width: 95px; height: 95px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; font-size: 2.4rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .cell:hover { border-color: #38bdf8; }
    button { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; }
    button:hover { background: #e11d48; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Game grid</a>
  <h1>Tic-Tac-Toe Arena</h1>
  <div class="status" id="statusText">Player X's Turn</div>

  <div class="board" id="board">
    <div class="cell" onclick="makeMove(0)"></div>
    <div class="cell" onclick="makeMove(1)"></div>
    <div class="cell" onclick="makeMove(2)"></div>
    <div class="cell" onclick="makeMove(3)"></div>
    <div class="cell" onclick="makeMove(4)"></div>
    <div class="cell" onclick="makeMove(5)"></div>
    <div class="cell" onclick="makeMove(6)"></div>
    <div class="cell" onclick="makeMove(7)"></div>
    <div class="cell" onclick="makeMove(8)"></div>
  </div>

  <button onclick="resetGame()">Restart Match</button>

  <script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');

    function makeMove(index) {
      if (board[index] !== "" || !gameActive) return;
      board[index] = currentPlayer;
      cells[index].textContent = currentPlayer;
      cells[index].style.color = currentPlayer === "X" ? "#38bdf8" : "#f43f5e";
      checkWinner();
    }

    function checkWinner() {
      for (let combo of wins) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          statusText.textContent = "🎉 Player " + currentPlayer + " Wins!";
          gameActive = false;
          return;
        }
      }
      if (!board.includes("")) {
        statusText.textContent = "It's a Draw!";
        gameActive = false;
        return;
      }
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusText.textContent = "Player " + currentPlayer + "'s Turn";
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameActive = true;
      statusText.textContent = "Player X's Turn";
      cells.forEach(cell => cell.textContent = "");
    }
  </script>
</body>
</html>
